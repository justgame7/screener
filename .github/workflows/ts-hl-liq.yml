# TradeSphere: Hyperliquid liquidation snapshot. Output goes to the `tradesphere-data` branch.
name: TradeSphere hl-liq snapshot
on:
  # Triggered every 30 minutes by cron-job.org via the workflow_dispatch API
  # (GitHub's native schedule was too unreliable, so there is no `schedule:` here).
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ts-hl-liq
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: tradesphere-data
          path: tradesphere/data
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Hyperliquid liquidation snapshot
        run: node tradesphere/scripts/hl-liq.js

      - name: Commit to tradesphere-data
        working-directory: tradesphere/data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add hl-liq.json
          git diff --cached --quiet && exit 0
          git commit -m "update hl-liq data"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin tradesphere-data && git push origin HEAD:tradesphere-data; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
          echo "push failed after retries"; exit 1
