# TradeSphere: prediction-market odds that matter for crypto (Kalshi macro/rates/crypto prices +
# Polymarket crypto policy). Writes predictions.json to the `tradesphere-data` branch.
# The market list and the "why it matters" notes live in tradesphere/scripts/predictions.js.
name: TradeSphere prediction markets
on:
  # Triggered every 10 minutes by cron-job.org via the workflow_dispatch API
  # (GitHub's native schedule was too unreliable).
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ts-kalshi
  cancel-in-progress: false
jobs:
  fetch:
    # To pause it, add: if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: tradesphere-data
          path: tradesphere/data
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build predictions.json
        run: node tradesphere/scripts/predictions.js

      - name: Commit to tradesphere-data
        working-directory: tradesphere/data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predictions.json
          git diff --cached --quiet && exit 0
          git commit -m "update predictions"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin tradesphere-data && git push origin HEAD:tradesphere-data; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
          echo "push failed after retries"; exit 1
