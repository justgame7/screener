<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screener</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#07080B">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Screener">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07080B;color:#EEF3F1;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
 background:radial-gradient(720px 480px at 8% -6%,rgba(53,224,192,.13),transparent 60%),radial-gradient(680px 520px at 96% 8%,rgba(100,130,255,.12),transparent 60%),#07080B}
.wrap{width:100%;max-width:760px}
h1{margin:0 0 6px;font-size:30px;letter-spacing:-.02em}
p.sub{margin:0 0 26px;color:#8B93A3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
a.card{display:block;padding:26px 22px;border-radius:16px;text-decoration:none;color:inherit;background:rgba(18,21,28,.7);border:1px solid rgba(255,255,255,.11);transition:.15s}
a.card:hover,a.card:focus-visible{transform:translateY(-2px);outline:none}
a.crypto:hover,a.crypto:focus-visible{border-color:#35E0C0;box-shadow:0 8px 28px -8px rgba(53,224,192,.4)}
a.mf:hover,a.mf:focus-visible{border-color:#6482ff;box-shadow:0 8px 28px -8px rgba(100,130,255,.4)}
[hidden]{display:none!important}
#installBtn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
#installBtn:hover{border-color:#35E0C0}
.ic{font-size:34px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:20px}
.card p{margin:0;color:#8B93A3;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Screener</h1>
  <p class="sub">What would you like to screen?</p>
  <div class="grid">
    <a class="card crypto" href="./crypto.html">
      <div class="ic">📈</div>
      <h2>Crypto / Stocks</h2>
      <p>Ichimoku cloud breakouts, custom screens and trade tools on live market data.</p>
    </a>
    <a class="card mf" href="./mf/index.html">
      <div class="ic">🏦</div>
      <h2>Mutual Funds</h2>
      <p>Screen Indian direct-growth funds: drawdown, returns, ATH distance, concentration and cash.</p>
    </a>
  </div>
  <p style="text-align:center;margin-top:22px"><button id="installBtn" type="button" hidden>⬇ Install app</button></p>
</div>
<script src="landing.js"></script>
</body>
</html>
